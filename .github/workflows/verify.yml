name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify verification scope
        id: scope
        run: python3 tools/verify.py --classify
      - name: Read canonical stage inventory
        id: matrix
        run: python3 tools/ci.py matrix

  documentation:
    needs: scope
    if: needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-verification
        with:
          stage: docs
      - run: python3 tools/verify.py

  qualification:
    name: Verify ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ubuntu-24.04
    env:
      POLYORAMA_USE_SYSTEM_UI_LIBS: '1'
      POLYORAMA_BROWSER_HEADFUL: '1'
      DISPLAY: ':95'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-verification
        id: setup
        with:
          stage: ${{ matrix.name }}
          ui: ${{ matrix.ui }}
          browser: ${{ matrix.browser }}
          consumer: ${{ matrix.consumer }}
      - name: Verify stage
        env:
          STAGE: ${{ matrix.name }}
          NEEDS_BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p .tools/runtime/verification-evidence
          if [[ "$NEEDS_BROWSER" == true ]]; then
            Xvfb "$DISPLAY" -screen 0 1440x900x24 -nolisten tcp +extension GLX \
              >.tools/runtime/verification-evidence/browser-xvfb.log 2>&1 &
            browser_xvfb_pid=$!
            trap 'kill "$browser_xvfb_pid" 2>/dev/null || true' EXIT
            sleep 1
          fi
          set -o pipefail
          cargo xtask verify-stage "$STAGE" 2>&1 | tee ".tools/runtime/verification-evidence/$STAGE.log"
      - name: Exclude generated browser output from Rust cache
        if: success()
        run: rm -rf -- target/browser-staging target/browser-production
      - name: Save pinned wasm-bindgen CLI
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.name == 'browser' && steps.setup.outputs.wasm-bindgen-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.127-${{ runner.os }}-${{ runner.arch }}
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.name }}
          path: .tools/runtime/verification-evidence
          retention-days: 14
          if-no-files-found: warn

  verify:
    needs: [scope, qualification, documentation]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read observed interface qualification
        if: needs.scope.outputs.mode == 'full' && needs.qualification.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: .tools/runtime/verification-evidence
          merge-multiple: true
      - name: Require the complete selected surface
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci.py gate

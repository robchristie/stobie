[package]
name = "stobie-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate embeds the SIL OFL 1.1 faces in assets/fonts/ (README.md there).
license = "Apache-2.0 AND OFL-1.1"

[features]
default = ["eframe"]
# GPU scalar-image presentation for image applications; see docs/image-application-composition.md.
image-rendering = ["dep:egui-wgpu", "dep:wgpu", "dep:stobie-render-wgpu"]
# Native and browser entry points for hosted applications. They leave GPU backends to the
# application: depend on eframe with its `wgpu` feature, or the browser build has no wgpu backend.
eframe = ["dep:eframe", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:console_error_panic_hook"]

[dependencies]
egui.workspace = true
egui-wgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
stobie-core = { path = "../stobie-core" }
stobie-protocol = { path = "../stobie-protocol", features = ["emath"] }
stobie-ui-egui-derive = { path = "../stobie-ui-egui-derive" }
stobie-render-wgpu = { path = "../stobie-render-wgpu", optional = true }
serde.workspace = true
serde_json.workspace = true
# CommonMark parsing for the Markdown recipe (MIT); no HTML renderer or command-line tool.
pulldown-cmark = { version = "0.13.4", default-features = false }
# Applications choose further eframe features; Linux windowing needs a winit backend to build.
# `links` lets the link recipe open URLs in the platform's default browser natively.
eframe = { version = "0.36.1", default-features = false, features = ["wgpu_no_default_features", "x11", "wayland", "links"], optional = true }

# Local time reads zone data natively (src/local_time.rs); the browser uses Intl.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jiff = "0.2.38"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Intl for local time in every browser build; eframe's entry points also use them.
wasm-bindgen.workspace = true
js-sys = "0.3.104"
wasm-bindgen-futures = { workspace = true, optional = true }
# eframe already enables most of these features, for the ARIA layer (Css* and
# StyleSheet style it through the CSSOM), renderer policy and the copy recipe's
# clipboard; MessageEvent, ServiceWorker* and Url serve Web Push
# (src/web_push.rs).
web-sys = { workspace = true, features = ["AddEventListenerOptions", "Clipboard", "console", "CssStyleDeclaration", "CssStyleSheet", "Document", "DomRect", "Element", "Event", "EventTarget", "FocusOptions", "HtmlCanvasElement", "HtmlElement", "KeyboardEvent", "Location", "MessageEvent", "Navigator", "Node", "ServiceWorkerContainer", "ServiceWorkerRegistration", "StyleSheet", "Touch", "TouchEvent", "TouchList", "Url", "Window"], optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[[example]]
name = "notes"
required-features = ["eframe"]
# Run the example's undo and redo tests with the crate's tests.
test = true

[dev-dependencies]
# Examples are applications: they choose eframe's GPU backends, as Record Desk does.
eframe.workspace = true
egui_kittest.workspace = true
trybuild = "1.0.122"
# The font notices test checks each bundled face against its recorded hash.
sha2 = "0.10.9"

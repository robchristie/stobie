<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>{{title}}</title>
    <style>
      :root { color-scheme: dark; background: #0b0f12; font-family: system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      #app-canvas { width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #9eb0b8; background: #0b0f12; }
      body.ready #loading { display: none; }
    </style>
  </head>
  <body>
    <canvas id="app-canvas" aria-label="{{title}}"></canvas>
    <div id="loading" role="status">Starting {{title}}…</div>
    <script type="module" src="bootstrap.js"></script>
  </body>
</html>

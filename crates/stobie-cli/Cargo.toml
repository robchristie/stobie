[package]
name = "stobie-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `stobie` command: create and build Stobie applications, launch or attach to one, read it compactly and operate it"

[[bin]]
name = "stobie"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
stobie-build = { path = "../stobie-build" }
stobie-client = { path = "../stobie-client" }

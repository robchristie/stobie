[package]
name = "emuella-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
web-time.workspace = true
wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
polyorama-core = { path = "../../crates/polyorama-core" }
polyorama-runtime = { path = "../../crates/polyorama-runtime" }
polyorama-render-wgpu = { path = "../../crates/polyorama-render-wgpu" }
polyorama-ui-egui = { path = "../../crates/polyorama-ui-egui" }
emuella-viewer-source = { path = "../../crates/emuella-viewer-source" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.82"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent"] }

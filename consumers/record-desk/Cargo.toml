[package]
name = "record-desk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stobie-core = { path = "../../crates/stobie-core" }
stobie-ui-egui = { path = "../../crates/stobie-ui-egui", default-features = false, features = ["eframe"] }
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
egui = { version = "=0.36.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.23.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
web-sys = { version = "0.3.82", features = ["Window", "Storage"] }

[dev-dependencies]
egui_kittest = "=0.36.1"

[profile.release]
lto = "thin"
codegen-units = 1
